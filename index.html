<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美食之旅 · 发现美味生活</title>

  <!-- 顶部导航 -->

        <span class="brand-mark" aria-hidden="true">🍳</span>
        <span>
          <span class="brand-text">美食之旅</span>
          <span class="brand-sub">Foodie Journal</span>
        </span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a class="nav-link" href="#/" data-nav="home">首页</a></li>
        <li><a class="nav-link" href="#/dishes" data-nav="dishes">美食分类</a></li>
        <li><a class="nav-link" href="#/favorites" data-nav="favorites">我的收藏</a></li>
        <li><a class="nav-link" href="#/about" data-nav="about">关于我们</a></li>

      <form class="nav-search" id="navSearchForm" role="search">

          <span class="fav-badge" id="favBadge" hidden>0</span>

        <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">☰</button>

    </div>
  </header>

  <!-- 内容区由 js/app.js 按路由渲染 -->
  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">

      <nav class="footer-links" aria-label="页脚导航">

  <script src="js/data.js"></script>
